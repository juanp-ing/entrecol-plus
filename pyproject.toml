[project]
name = "entrecol"
version = "0.1.0"
description = "Sistema de informacion EntreCOL+ - nomina y catalogo de entretenimiento"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.163.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.4",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
